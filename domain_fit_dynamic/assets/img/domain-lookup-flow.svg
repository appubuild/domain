<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">A simplified DNS lookup</title>
  <desc id="desc">A browser asks a recursive resolver. If the answer is not cached, the resolver follows referrals to root, top-level-domain, and authoritative DNS servers, then returns an answer so the browser can connect to the website host.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7f7ff"/><stop offset="1" stop-color="#effaf7"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5d4be8"/><stop offset="1" stop-color="#18a889"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#7268c9"/></marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#138b70"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#32355f" flood-opacity=".10"/></filter>
  </defs>
  <rect width="1200" height="520" rx="30" fill="url(#bg)"/>
  <text x="56" y="62" fill="#18213a" font-family="system-ui, sans-serif" font-size="27" font-weight="750">What happens after you enter a domain?</text>
  <text x="56" y="94" fill="#65708a" font-family="system-ui, sans-serif" font-size="16">A simplified lookup when the resolver does not already have a cached answer</text>
  <g filter="url(#shadow)" font-family="system-ui, sans-serif">
    <rect x="55" y="150" width="190" height="128" rx="18" fill="#fff" stroke="#dfe3ef"/>
    <rect x="285" y="150" width="210" height="128" rx="18" fill="#fff" stroke="#dfe3ef"/>
    <rect x="535" y="150" width="155" height="128" rx="18" fill="#fff" stroke="#dfe3ef"/>
    <rect x="730" y="150" width="155" height="128" rx="18" fill="#fff" stroke="#dfe3ef"/>
    <rect x="925" y="150" width="220" height="128" rx="18" fill="#fff" stroke="#dfe3ef"/>
    <circle cx="87" cy="184" r="16" fill="#eeecff"/><text x="87" y="190" text-anchor="middle" fill="#5746e8" font-size="17" font-weight="800">1</text>
    <circle cx="317" cy="184" r="16" fill="#eeecff"/><text x="317" y="190" text-anchor="middle" fill="#5746e8" font-size="17" font-weight="800">2</text>
    <circle cx="567" cy="184" r="16" fill="#eef8f5"/><text x="567" y="190" text-anchor="middle" fill="#138b70" font-size="17" font-weight="800">3</text>
    <circle cx="762" cy="184" r="16" fill="#eef8f5"/><text x="762" y="190" text-anchor="middle" fill="#138b70" font-size="17" font-weight="800">4</text>
    <circle cx="957" cy="184" r="16" fill="#eef8f5"/><text x="957" y="190" text-anchor="middle" fill="#138b70" font-size="17" font-weight="800">5</text>
    <text x="77" y="226" fill="#18213a" font-size="17" font-weight="750">Browser + device</text>
    <text x="77" y="251" fill="#65708a" font-size="13">Checks local DNS cache</text>
    <text x="307" y="226" fill="#18213a" font-size="17" font-weight="750">Recursive resolver</text>
    <text x="307" y="251" fill="#65708a" font-size="13">Checks cache, asks DNS</text>
    <text x="557" y="226" fill="#18213a" font-size="16" font-weight="750">Root DNS</text>
    <text x="557" y="251" fill="#65708a" font-size="13">Refers to the TLD</text>
    <text x="752" y="226" fill="#18213a" font-size="16" font-weight="750">TLD DNS</text>
    <text x="752" y="251" fill="#65708a" font-size="13">Refers to the domain</text>
    <text x="947" y="226" fill="#18213a" font-size="17" font-weight="750">Authoritative DNS</text>
    <text x="947" y="251" fill="#65708a" font-size="13">Returns configured records</text>
  </g>
  <path d="M245 214h34M495 214h34M690 214h34M885 214h34" fill="none" stroke="#7268c9" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="600" y="324" text-anchor="middle" fill="#138b70" font-family="system-ui, sans-serif" font-size="15" font-weight="700">The answer is cached for its TTL and returned to the browser</text>
  <path d="M1034 292v68H392v-69" fill="none" stroke="#138b70" stroke-width="3" stroke-dasharray="7 7" marker-end="url(#arrowGreen)"/>
  <g filter="url(#shadow)" font-family="system-ui, sans-serif">
    <rect x="280" y="400" width="250" height="72" rx="16" fill="url(#accent)"/>
    <rect x="650" y="400" width="290" height="72" rx="16" fill="#fff" stroke="#dfe3ef"/>
    <text x="405" y="430" text-anchor="middle" fill="#fff" font-size="17" font-weight="750">Browser connects</text>
    <text x="405" y="452" text-anchor="middle" fill="#fff" font-size="13">HTTPS request to the service</text>
    <text x="795" y="430" text-anchor="middle" fill="#18213a" font-size="17" font-weight="750">Website host / CDN</text>
    <text x="795" y="452" text-anchor="middle" fill="#65708a" font-size="13">Returns the page or another response</text>
  </g>
  <path d="M530 436h108" fill="none" stroke="#7268c9" stroke-width="3" marker-end="url(#arrow)"/>
</svg>
