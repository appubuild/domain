[package]
name = "aura-desktop"
version = "0.1.0"
description = "AURA — personal AI agent desktop shell"
authors = ["AURA"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "aura_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri 2 core + the plugins the shell actually uses.
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "macros", "rt-multi-thread"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Hardening: explicit allow-list for shell commands the agent bridge may invoke.
regex = "1"
# Process enumeration for the read-only diagnostics command (not used for control).
[target.'cfg(windows)'.dependencies]
sysinfo = "0.33"


[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
