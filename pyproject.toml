[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nova-studio"
version = "0.1.0"
description = "Nova Studio — professional offline-first desktop video editor with an advanced AI Caption Studio."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Nova Studio Team" }]
keywords = ["video", "editor", "nle", "captions", "whisper", "ffmpeg", "desktop"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video :: Non-Linear Editor",
    "Typing :: Typed",
]

# Runtime dependencies are pinned to compatible ranges; exact lockfiles live in
# `requirements/` so that reproducible builds never depend on network drift.
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "orjson>=3.10,<4.0",
    "av>=13.0,<19.0",
    "numpy>=1.26,<3.0",
    "pillow>=10.3,<13.0",
    "opencv-python-headless>=4.9,<6.0",
    "imageio-ffmpeg>=0.5,<1.0",
    "structlog>=24.1,<27.0",
    "watchfiles>=0.21,<1.0",
    "psutil>=5.9,<8.0",
    "typing-extensions>=4.11",
]

[project.optional-dependencies]
# Speech recognition is optional so that a machine without a model download can
# still run every other Nova Studio subsystem.
asr = ["faster-whisper>=1.0,<2.0"]
# Desktop shell (pywebview) — not required for headless/server or CI runs.
desktop = ["pywebview>=5.1,<7.0"]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]
all = ["nova-studio[asr,desktop,dev]"]

[project.urls]
Homepage = "https://github.com/appubuild/domain"

[project.scripts]
nova-studio = "nova_studio.cli:main"

[tool.setuptools.packages.find]
include = ["nova_studio*"]
exclude = ["tests*", "frontend*", "apps*", "scripts*", "docs*"]

[tool.setuptools.package-data]
"nova_studio" = ["py.typed", "resources/**/*", "i18n/**/*.json"]

# ---------------------------------------------------------------------------
# Ruff — lint + format. Rules chosen to enforce the architectural invariants
# documented in docs/architecture/ADR-0002-clean-architecture-layers.md.
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["nova_studio", "tests", "apps", "scripts"]
extend-exclude = ["frontend", "docs", ".venv"]

[tool.ruff.lint]
select = [
    "E", "W",       # pycodestyle
    "F",            # pyflakes
    "I",            # isort
    "N",            # pep8-naming
    "UP",           # pyupgrade
    "B",            # flake8-bugbear
    "C4",           # flake8-comprehensions
    "SIM",          # flake8-simplify
    "TCH",          # flake8-type-checking
    "RUF",          # ruff-specific
    "ASYNC",        # flake8-async
    "PTH",          # flake8-use-pathlib
    "RET",          # flake8-return
    "ARG",          # flake8-unused-arguments
    "PT",           # flake8-pytest-style
    "TRY",          # tryceratops
    "PERF",         # perflint
    "TID",          # flake8-tidy-imports
    "LOG",          # flake8-logging
]
ignore = [
    "E501",     # line length handled by the formatter
    "TRY003",   # long exception messages are acceptable in a user-facing app
    "B008",     # FastAPI Depends() in defaults is idiomatic
    "RET504",   # explicit return of assignment aids debugging in hot paths
    "SIM108",   # ternaries are not always clearer
    "ARG002",   # unused args are common in interface implementations
    "PT011",    # broad pytest.raises match is intentional in some suites
    # A bounded wait is the intended API for an event stream: the alternative is
    # an unbounded await that cannot be cancelled by a UI timeout.
    "ASYNC109",
    # Tests intentionally assert compound properties on one line for readability.
    "PT018",
    # En/em dashes and curly quotes are deliberate typography in user-facing and
    # developer prose; RUF001-003 would degrade the documentation.
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Tests use lambdas whose signature is dictated by the handler interface, so an
# unused parameter is expected rather than a smell.
"tests/**" = ["S101", "ARG001", "ARG005", "PLR2004", "B011"]
"**/__init__.py" = ["F401"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"sqlite3".msg = "Use nova_studio.infra.persistence.sqlite instead of stdlib sqlite3 directly."

[tool.ruff.lint.isort]
known-first-party = ["nova_studio"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

# ---------------------------------------------------------------------------
# mypy — strict typing is an architectural requirement, not an aspiration.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
files = ["nova_studio"]
strict = true
warn_unreachable = true
warn_return_any = true
disallow_any_explicit = false
show_error_codes = true
pretty = true
plugins = ["pydantic.mypy"]
exclude = ["^frontend/", "^\\.venv/", "^build/", "^dist/"]

[[tool.mypy.overrides]]
module = ["av.*", "cv2.*", "faster_whisper.*", "imageio_ffmpeg.*", "webview.*", "onnxruntime.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: fast, isolated tests with no I/O beyond temp dirs",
    "integration: tests spanning multiple modules or real media files",
    "media: tests that require PyAV/FFmpeg and real encoded assets",
    "asr: tests that require a downloaded Whisper model (skipped when absent)",
    "gpu: tests that require a GPU backend",
    "perf: performance/benchmark tests, excluded from default runs",
    "slow: long-running tests, excluded from default runs",
]
filterwarnings = ["error::DeprecationWarning:nova_studio.*"]

# ---------------------------------------------------------------------------
# coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
branch = true
source = ["nova_studio"]
omit = ["*/tests/*", "*/__main__.py"]

[tool.coverage.report]
precision = 1
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
    "def __repr__",
]
